apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: otel-collector
      app.kubernetes.io/name: opentelemetry-collector
      component: standalone-collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: auth-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flag-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: targeting-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: evaluation-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: analytics-service
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 13133
          protocol: TCP
        - port: 8888
          protocol: TCP
        - port: 8889
          protocol: TCP
  egress:
    # Kubernetes API: service port and common API server target ports.
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
        - port: 8443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 3100
          protocol: TCP
        - port: 9090
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
