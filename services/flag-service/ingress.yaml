apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-api
  namespace: flag-service
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /flags
        pathType: Prefix
        backend:
          service:
            name: flag-service
            port:
              name: http
