apiVersion: v1
kind: Namespace
metadata:
  name: auth-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-configmap
  namespace: auth-service
data:
  PORT: "8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: auth-service
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:postgres@postgres.data.svc.cluster.local:5432/authdb?sslmode=disable
  MASTER_KEY: local-master-key
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: auth-service
spec:
  selector: {app: auth-service}
  ports: [{name: http, port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: auth-service
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
      - name: auth-service
        image: togglemaster/auth:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8001}]
        envFrom:
        - configMapRef: {name: auth-service-configmap}
        - secretRef: {name: auth-service-secret}
        readinessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 15}
