apiVersion: v1
kind: Namespace
metadata:
  name: flag-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-service-configmap
  namespace: flag-service
data:
  PORT: "8002"
  AUTH_SERVICE_URL: http://auth-service.auth-service.svc.cluster.local:8001
  OTEL_SERVICE_NAME: flag-service
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_METRICS_EXPORTER: otlp
  OTEL_SEMCONV_STABILITY_OPT_IN: http
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-service-secret
  namespace: flag-service
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:postgres@postgres.data.svc.cluster.local:5432/flagsdb?sslmode=disable
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: flag-service
spec:
  selector: {app: flag-service}
  ports: [{name: http, port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service-deployment
  namespace: flag-service
spec:
  replicas: 1
  selector: {matchLabels: {app: flag-service}}
  template:
    metadata: {labels: {app: flag-service}}
    spec:
      containers:
      - name: flag-service
        image: togglemaster/flag:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8002}]
        envFrom:
        - configMapRef: {name: flag-service-configmap}
        - secretRef: {name: flag-service-secret}
        readinessProbe: {httpGet: {path: /health, port: 8002}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8002}, initialDelaySeconds: 15}
