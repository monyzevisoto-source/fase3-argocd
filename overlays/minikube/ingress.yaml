apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-api
  namespace: auth-service
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: togglemaster.local
    http:
      paths:
      - path: /auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service: {name: auth-service, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: togglemaster-api
  namespace: flag-service
spec:
  ingressClassName: nginx
  rules:
  - host: togglemaster.local
    http:
      paths:
      - path: /flags
        pathType: Prefix
        backend:
          service: {name: flag-service, port: {name: http}}
---
