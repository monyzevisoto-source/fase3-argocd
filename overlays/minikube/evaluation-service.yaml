apiVersion: v1
kind: Namespace
metadata:
  name: evaluation-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evaluation-service-configmap
  namespace: evaluation-service
data:
  PORT: "8004"
  REDIS_URL: redis://redis.data.svc.cluster.local:6379
  FLAG_SERVICE_URL: http://flag-service.flag-service.svc.cluster.local:8002
  TARGETING_SERVICE_URL: http://targeting-service.targeting-service.svc.cluster.local:8003
---
apiVersion: v1
kind: Secret
metadata:
  name: evaluation-service-secret
  namespace: evaluation-service
type: Opaque
stringData:
  SERVICE_API_KEY: local-service-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: evaluation-service
spec:
  selector: {app: evaluation-service}
  ports: [{name: http, port: 8004, targetPort: 8004}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-deployment
  namespace: evaluation-service
spec:
  replicas: 1
  selector: {matchLabels: {app: evaluation-service}}
  template:
    metadata: {labels: {app: evaluation-service}}
    spec:
      containers:
      - name: evaluation-service
        image: togglemaster/evaluation:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8004}]
        envFrom:
        - configMapRef: {name: evaluation-service-configmap}
        - secretRef: {name: evaluation-service-secret}
        readinessProbe: {httpGet: {path: /health, port: 8004}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: 8004}, initialDelaySeconds: 15}
