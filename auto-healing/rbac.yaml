apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-healing-sensor
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-healing-sensor
  namespace: argo-events
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [workflowtemplates]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-healing-sensor
  namespace: argo-events
subjects:
  - kind: ServiceAccount
    name: auto-healing-sensor
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-healing-sensor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auto-healing-workflow
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-healing-evaluation
  namespace: evaluation-service
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [evaluation-service-deployment]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [apps]
    resources: [deployments/status]
    resourceNames: [evaluation-service-deployment]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auto-healing-workflow
  namespace: argo-events
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-healing-workflow
  namespace: argo-events
subjects:
  - kind: ServiceAccount
    name: auto-healing-workflow
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-healing-workflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auto-healing-evaluation
  namespace: evaluation-service
subjects:
  - kind: ServiceAccount
    name: auto-healing-workflow
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auto-healing-evaluation
