apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auto-healing-minikube
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/monyzevisoto-source/fase3-argocd.git
    targetRevision: main
    path: auto-healing
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
