apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-minikube
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.10.1
    helm:
      # Keep the existing Kubernetes resource and PVC names during the
      # Application rename. This avoids recreating Prometheus/Grafana data.
      releaseName: observability-local
      valuesObject:
        grafana:
          enabled: true
          adminPassword: prometheus-minikube
          additionalDataSources:
            - name: Loki Minikube
              uid: logs-minikube
              type: loki
              access: proxy
              url: http://loki-minikube.observability.svc.cluster.local:3100
              isDefault: false
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: microservices
                  orgId: 1
                  folder: Microserviços
                  type: file
                  disableDeletion: false
                  options:
                    path: /var/lib/grafana/dashboards/microservices
          dashboards:
            microservices:
              logs:
                json: |
                  {
                    "uid": "microservices-logs-minikube",
                    "title": "Microserviços — Logs Minikube",
                    "schemaVersion": 39,
                    "version": 1,
                    "tags": [
                      "minikube",
                      "logs"
                    ],
                    "timezone": "browser",
                    "time": {
                      "from": "now-15m",
                      "to": "now"
                    },
                    "refresh": "30s",
                    "templating": {
                      "list": [
                        {
                          "name": "namespace",
                          "label": "Namespace",
                          "type": "query",
                          "datasource": {
                            "type": "loki",
                            "uid": "logs-minikube"
                          },
                          "query": "label_values({k8s_cluster_name=\"minikube\"}, k8s_namespace_name)",
                          "definition": "label_values({k8s_cluster_name=\"minikube\"}, k8s_namespace_name)",
                          "refresh": 2,
                          "multi": true,
                          "includeAll": true,
                          "allValue": ".+",
                          "current": {
                            "text": "All",
                            "value": "$__all"
                          }
                        },
                        {
                          "name": "deployment",
                          "label": "Deployment",
                          "type": "query",
                          "datasource": {
                            "type": "loki",
                            "uid": "logs-minikube"
                          },
                          "query": "label_values({k8s_cluster_name=\"minikube\",k8s_namespace_name=~\"$namespace\"}, k8s_deployment_name)",
                          "definition": "label_values({k8s_cluster_name=\"minikube\",k8s_namespace_name=~\"$namespace\"}, k8s_deployment_name)",
                          "refresh": 2,
                          "multi": true,
                          "includeAll": true,
                          "allValue": ".+",
                          "current": {
                            "text": "All",
                            "value": "$__all"
                          }
                        }
                      ]
                    },
                    "panels": [
                      {
                        "id": 1,
                        "title": "Logs por namespace e deployment",
                        "type": "logs",
                        "datasource": {
                          "type": "loki",
                          "uid": "logs-minikube"
                        },
                        "gridPos": {
                          "x": 0,
                          "y": 0,
                          "w": 24,
                          "h": 20
                        },
                        "targets": [
                          {
                            "refId": "A",
                            "expr": "{k8s_cluster_name=\"minikube\",k8s_namespace_name=~\"$namespace\",k8s_deployment_name=~\"$deployment\"} | json | line_format \"{{.body}}\""
                          }
                        ],
                        "options": {
                          "showTime": true,
                          "showCommonLabels": false,
                          "wrapLogMessage": true,
                          "sortOrder": "Descending"
                        }
                      }
                    ]
                  }
          persistence:
            enabled: true
            size: 2Gi
          service:
            type: ClusterIP

        prometheus:
          prometheusSpec:
            retention: 2d
            # Discover ServiceMonitor/PodMonitor resources from every namespace.
            # This allows application workloads to opt in with their own monitors.
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: standard
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 5Gi
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

        alertmanager:
          enabled: false

        # Minikube does not expose these control-plane endpoints on the node IP.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true


