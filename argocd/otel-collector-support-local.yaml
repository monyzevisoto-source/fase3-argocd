apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-support-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/monyzevisoto-source/fase3-argocd.git
    targetRevision: main
    path: observability/otel-collector-support
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
