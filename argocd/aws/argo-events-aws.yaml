apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: 2.4.27
    helm:
      valuesObject:
        controller:
          replicas: 1
        configs:
          jetstream:
            streamConfig:
              replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
